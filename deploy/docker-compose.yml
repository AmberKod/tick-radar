name: tick-radar

x-backend: &backend
  image: tick-radar-backend:${TR_VERSION:-0.1.0}
  build:
    context: ../backend
    dockerfile: Dockerfile
  environment: &backend-env
    TR_ENVIRONMENT: ${TR_ENVIRONMENT:-development}
    TR_LOG_LEVEL: ${TR_LOG_LEVEL:-INFO}
    TR_VERSION: ${TR_VERSION:-0.1.0}
    TR_API_TOKEN: ${TR_API_TOKEN:-}
    TR_MYSQL_HOST: mysql
    TR_MYSQL_PORT: "3306"
    TR_MYSQL_DATABASE: ${TR_MYSQL_DATABASE:-tick_radar}
    TR_MYSQL_USER: ${TR_MYSQL_USER:-tick_radar}
    TR_MYSQL_PASSWORD: ${TR_MYSQL_PASSWORD:?Set TR_MYSQL_PASSWORD in .env}
    TR_REDIS_URL: redis://redis:6379/0
    TR_PROBE_TIMEOUT_SECONDS: ${TR_PROBE_TIMEOUT_SECONDS:-1}
    TR_MARKET_OBSERVATION_ENABLED: ${TR_MARKET_OBSERVATION_ENABLED:-true}
    TR_QUOTE_REFRESH_INTERVAL_SECONDS: ${TR_QUOTE_REFRESH_INTERVAL_SECONDS:-30}
    TR_QUOTE_MAX_SYMBOLS: ${TR_QUOTE_MAX_SYMBOLS:-50}
    TR_CORS_ORIGINS: '${TR_CORS_ORIGINS:-["http://127.0.0.1:15173"]}'
  networks: [app]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${TR_MYSQL_DATABASE:-tick_radar}
      MYSQL_USER: ${TR_MYSQL_USER:-tick_radar}
      MYSQL_PASSWORD: ${TR_MYSQL_PASSWORD:?Set TR_MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${TR_MYSQL_ROOT_PASSWORD:?Set TR_MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: [mysql-data:/var/lib/mysql]
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7.4-alpine
    # Redis 仅为可重建缓存；此阶段没有需恢复的业务事实。
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [app]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    <<: *backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      mysql: {condition: service_healthy}
    restart: "no"

  backend-api:
    <<: *backend
    command: ["python", "-m", "uvicorn", "cross_market.apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  backend-worker:
    <<: *backend
    command: ["python", "-m", "cross_market.apps.worker.main"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  nginx:
    image: tick-radar-frontend:${TR_VERSION:-0.1.0}
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    ports: ["127.0.0.1:${TR_WEB_PORT:-18180}:80"]
    depends_on:
      backend-api: {condition: service_healthy}
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  mysql-data:

networks:
  app:
    driver: bridge
